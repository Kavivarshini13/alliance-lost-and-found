<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login | Alliance University Lost &amp; Found</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: var(--font-family);
            color: var(--text-main);

            /* Existing Background Design - Preserved Intact */
            background:
                linear-gradient(
                    rgba(18, 35, 65, 0.52),
                    rgba(18, 35, 65, 0.52)
                ),
                url("campus.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .auth-card {
            width: min(480px, 94vw);
            padding: 36px 32px;
            background: rgba(255, 255, 255, 0.98);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 26px;
        }

        .auth-logo {
            width: auto;
            max-width: 260px;
            height: auto;
            max-height: 54px;
            object-fit: contain;
            display: block;
            margin: 0 auto 14px;
        }

        .auth-header h1 {
            color: var(--primary);
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .auth-header p {
            color: var(--text-muted);
            font-size: 13.5px;
        }

        .auth-form-group {
            margin-bottom: 18px;
        }

        .auth-form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 600;
            color: var(--primary);
        }

        .auth-form-group input {
            width: 100%;
            height: 46px;
            padding: 0 14px;
            border: 1px solid #cbd5e1;
            border-radius: var(--radius-sm);
            font-size: 14px;
            background: white;
            outline: none;
            transition: all 0.2s;
        }

        .auth-form-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(18, 59, 104, 0.12);
        }

        .password-wrap {
            position: relative;
        }

        .password-toggle-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 14px;
            padding: 4px;
        }

        .auth-submit-btn {
            width: 100%;
            height: 48px;
            margin-top: 10px;
            border: none;
            border-radius: var(--radius-sm);
            background: var(--primary);
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .auth-submit-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(18, 59, 104, 0.25);
        }

        .auth-links {
            margin-top: 22px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 13.5px;
        }

        .auth-links a {
            color: var(--primary);
            font-weight: 600;
        }

        .auth-links a:hover {
            text-decoration: underline;
        }

        #errorMessage {
            display: none;
            margin-top: 16px;
            padding: 12px;
            border-radius: var(--radius-sm);
            background: var(--lost-bg);
            border: 1px solid var(--lost-border);
            color: var(--lost-text);
            font-size: 13px;
            font-weight: 500;
            text-align: center;
        }
    </style>
</head>
<body>

    <main class="auth-card">
        <div class="auth-header">
            <a href="index.html">
                <img src="logo.png" alt="Alliance University Logo" class="auth-logo">
            </a>
            <h1>Alliance University</h1>
            <p>Student Portal Sign In</p>
        </div>

        <form id="loginForm">
            <div class="auth-form-group">
                <label for="email">Student University Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="auth-form-group">
                <label for="password">Password</label>
                <div class="password-wrap">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        required
                    >
                    <button type="button" class="password-toggle-btn" onclick="togglePassword('password')">👁️</button>
                </div>
            </div>

            <button type="submit" class="auth-submit-btn">Login as Student</button>
            <div id="errorMessage" role="alert"></div>
        </form>

        <div class="auth-links">
            <p style="color:var(--text-muted);margin:0;">
                Don't have an account yet? <a href="register.html">Register as Student</a>
            </p>
            <p style="margin:0;">
                <a href="admin.html">Administrator Access &rarr;</a>
            </p>
        </div>
    </main>

    <script src="portal.js"></script>
</body>
</html>
